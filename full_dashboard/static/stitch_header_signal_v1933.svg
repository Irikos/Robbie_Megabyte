<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 172 34"
    fill="none"
>

    <defs>

        <filter
            id="g"
            x="-50%"
            y="-100%"
            width="200%"
            height="300%"
        >
            <feGaussianBlur
                stdDeviation=".55"
                result="blur"
            />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>


    <!--
        NAV CONNECTION POINT

        Right side of the artwork is the edge touching the tab box.
    -->

    <path
        d="M170 17H150"
        stroke="#159873"
        stroke-width="1.3"
        stroke-linecap="round"
        opacity=".72"
    />


    <circle
        cx="149"
        cy="17"
        r="1.7"
        fill="#8ecb7f"
        filter="url(#g)"
    >
        <animate
            attributeName="opacity"
            values=".35;1;.35"
            dur="2.4s"
            repeatCount="indefinite"
        />
    </circle>


    <!-- ==========================================================
         TWO CLEAN OUTWARD SIGNAL PATHS
         ========================================================== -->

    <path
        d="
            M147 17
            H125
            L116 11
            H91
            L83 8
            H54
            L45 12
            H18
        "
        stroke="#108465"
        stroke-width="1.15"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".67"
    />


    <path
        d="
            M147 19
            H119
            L110 24
            H82
            L72 27
            H39
            L31 23
            H8
        "
        stroke="#b57c08"
        stroke-width=".95"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".55"
    />


    <!-- small stationary rail fragments -->

    <g
        stroke="#11765c"
        stroke-width=".8"
        stroke-linecap="round"
        opacity=".38"
    >
        <path d="M104 7H119"/>
        <path d="M65 13H78"/>
        <path d="M22 17H35"/>
    </g>


    <!-- ==========================================================
         MOVING PACKETS
         ========================================================== -->

    <circle
        r="1.65"
        fill="#23b98b"
        filter="url(#g)"
    >
        <animateMotion
            dur="3.8s"
            repeatCount="indefinite"
            path="
                M147 17
                H125
                L116 11
                H91
                L83 8
                H54
                L45 12
                H18
            "
        />

        <animate
            attributeName="opacity"
            values=".15;1;.8;.15"
            dur="3.8s"
            repeatCount="indefinite"
        />
    </circle>


    <circle
        r="1.4"
        fill="#f59e0b"
        filter="url(#g)"
    >
        <animateMotion
            dur="5s"
            repeatCount="indefinite"
            path="
                M147 19
                H119
                L110 24
                H82
                L72 27
                H39
                L31 23
                H8
            "
        />

        <animate
            attributeName="opacity"
            values=".12;.85;.55;.12"
            dur="5s"
            repeatCount="indefinite"
        />
    </circle>


    <!-- ==========================================================
         SMALL OUTER IDLE-WINDOW STYLE SCANNER
         ========================================================== -->

    <g
        transform="translate(55 18)"
    >

        <path
            d="M0 -7L7 0L0 7L-7 0Z"
            stroke="#159873"
            stroke-width="1"
            opacity=".72"
            filter="url(#g)"
        >
            <animateTransform
                attributeName="transform"
                type="rotate"
                from="0"
                to="360"
                dur="9s"
                repeatCount="indefinite"
            />
        </path>


        <circle
            r="10"
            stroke="#0d745a"
            stroke-width=".8"
            stroke-dasharray="3 4"
            opacity=".43"
        >
            <animateTransform
                attributeName="transform"
                type="rotate"
                from="360"
                to="0"
                dur="12s"
                repeatCount="indefinite"
            />
        </circle>


        <circle
            r="1.6"
            fill="#f59e0b"
            filter="url(#g)"
        >
            <animate
                attributeName="r"
                values="1.1;2;1.1"
                dur="2.6s"
                repeatCount="indefinite"
            />
        </circle>

    </g>


    <!-- quiet terminal bars -->

    <g
        stroke-linecap="round"
    >

        <path
            d="M2 13H15"
            stroke="#0f775c"
            stroke-width=".9"
            opacity=".36"
        />

        <path
            d="M1 18H12"
            stroke="#159873"
            stroke-width="1"
            opacity=".52"
        />

        <path
            d="M5 23H18"
            stroke="#b57c08"
            stroke-width=".8"
            opacity=".34"
        />

    </g>

</svg>
