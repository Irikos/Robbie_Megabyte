          dur="4.8s"
          repeatCount="indefinite"
      />

      <animate
          attributeName="opacity"
          values="0;.72;.58;.44;.28;.14;0"
          dur="4.8s"
          repeatCount="indefinite"
      />

  </rect>


  <!-- tiny amber depth pulse -->
  <circle
      cy="19"
      r="1.2"
      fill="#f59e0b"
  >

      <animate
          attributeName="cx"
          values="198;165;137;116;97"
          dur="3.7s"
          repeatCount="indefinite"
      />

      <animate
          attributeName="opacity"
          values=".65;.48;.32;.16;0"
          dur="3.7s"
          repeatCount="indefinite"
