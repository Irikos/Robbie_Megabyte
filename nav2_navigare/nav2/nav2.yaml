controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.03
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      # RPP (Humble) nu rotește niciodată spre yaw-ul goal-ului, doar spre
      # traseu; o toleranță strictă aici bloca FollowPath la infinit lângă
      # destinație (yaw-ul nu se corecta singur) până la epuizarea recovery.
      # Orientarea finală este acum executată explicit, separat, prin Spin
      # (nav2_runtime.Nav2Runtime._start_final_orientation, toleranță 0.12
      # rad verificată acolo în cod). Toleranța de aici rămâne > pi ca să
      # nu mai condiționeze deloc finalizarea FollowPath pe orientare.
      yaw_goal_tolerance: 3.20
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.80 # 0.80
      lookahead_dist: 0.40
      # Humble RPP decide rotația finală după distanța la lookahead point.
      # Trebuie să rămână STRICT peste xy_goal_tolerance (0.25), inclusiv
      # când robotul stă pe loc, altfel rotește spre yaw final departe de goal.
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.65
      lookahead_time: 0.9
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.28
      approach_velocity_scaling_dist: 0.70
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.28
      use_cost_regulated_linear_velocity_scaling: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.8
      use_rotate_to_heading: true
      # Corecțiile mici și medii se fac urmărind ruta, cu vx + wz. Pragul vechi
      # de 0.20 rad (11.5°) transforma aproape orice abatere într-o rotire pe
      # loc cu vx=0. Rotația inițială rămâne numai peste 45°, iar orientarea
      # finală continuă să fie executată separat de goal checker.
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.60
      # RPP limitează rotația și după viteza măsurată din odometrie. Cât timp
      # G1 nu se mișcă, accelerația împărțită la 20 Hz devine plafonul comenzii:
      # 4 dădea 0.20 rad/s, iar 12 doar 0.60 rad/s. Valoarea 32 permite cererea
      # nominală de 1.60 rad/s din primul calcul. Nu este accelerația fizică:
      # velocity_smoother păstrează separat rampa trimisă robotului la 4 rad/s².
      max_angular_accel: 32.00
      allow_reversing: false
      use_interpolation: true
      transform_tolerance: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.34, 0.30], [0.34, -0.30], [-0.25, -0.30], [-0.25, 0.30]]"
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.25
          obstacle_max_range: 4.0
          raytrace_min_range: 0.20
          raytrace_max_range: 5.0
          observation_persistence: 0.40
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.28
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[0.34, 0.30], [0.34, -0.30], [-0.25, -0.30], [-0.25, 0.30]]" # "[[0.34, 0.25], [0.34, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.25
          obstacle_max_range: 4.0
          raytrace_min_range: 0.20
          raytrace_max_range: 5.0
          observation_persistence: 0.60
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.28
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.60
    min_rotational_vel: 0.35
    # Evită același plafon dependent de odometrie în behavior-ul Spin;
    # smoother-ul de după selector păstrează accelerația efectivă la 4 rad/s².
    rotational_acc_lim: 32.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.80, 0.25, 1.60]
    min_velocity: [-0.35, -0.25, -1.60]
    max_accel: [1.10, 0.55, 4.00]
    # Decelerarea normală este intenționat progresivă. Collision Monitor este
    # după smoother și poate trimite în continuare stop imediat la pericol real.
    max_decel: [-0.50, -0.40, -2.00]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.02, 0.03]
    velocity_timeout: 0.25

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/cmd_vel_smoothed
    cmd_vel_out_topic: /nav2/cmd_vel_safe
    transform_tolerance: 0.25
    # Aliniat cu watchdog-ul scanului din backend; 0.35 s producea opriri la
    # jitter DDS scurt, deși scanul era încă considerat sănătos.
    source_timeout: 0.60
    base_shift_correction: true
    stop_pub_timeout: 1.0
    # O zonă STOP fixă blochează orice comandă când este ocupată, inclusiv
    # mersul în sens opus obstacolului. Modelul APPROACH simulează direcția
    # comenzii și păstrează timpul de oprire fără să imobilizeze robotul lângă
    # un perete.
    polygons: [DirectionalApproach]
    DirectionalApproach:
      type: polygon
      points: [0.35, 0.31, 0.35, -0.31, -0.26, -0.31, -0.26, 0.31]
      action_type: approach
      time_before_collision: 1.00
      simulation_time_step: 0.05
      max_points: 5
      visualize: true
      polygon_pub_topic: /nav2/directional_approach
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: false
    target_frame: base_link
    transform_tolerance: 0.20
    queue_size: 20
    min_height: -0.20
    max_height: 1.45
    angle_min: -3.14159265359
    angle_max: 3.14159265359
    angle_increment: 0.00872664626
    scan_time: 0.10
    range_min: 0.25
    range_max: 12.0
    use_inf: true
    inf_epsilon: 1.0
