<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 210 36"
    fill="none"
>

  <!--
      STITCH V1.9.39

      A completely redrawn horizontal DEPTH motif.

      The planes are effectively the dashboard DEPTH animation
      turned sideways, but simplified for the top header.
  -->


  <!-- nav connection -->

  <path
      d="M209 18H181"
      stroke="#128361"
      stroke-width="1"
      stroke-linecap="round"
      opacity=".45"
  />


  <!-- =========================================================
       DEPTH PLANES
       ========================================================= -->

  <g
      stroke-linejoin="round"
      stroke-linecap="round"
  >

      <!-- near plane -->

      <path
          d="M177 14
             L162 10
             L162 26
             L177 22"
          stroke="#159873"
          stroke-width="1.1"
          opacity=".72"
      >
          <animate
              attributeName="opacity"
              values=".45;.82;.45"
              dur="3.6s"
              repeatCount="indefinite"
          />
      </path>


      <!-- middle plane -->

      <path
          d="M155 12
             L135 7
             L135 29
             L155 24"
          stroke="#0f8666"
          stroke-width="1"
          opacity=".58"
      >
          <animate
              attributeName="opacity"
              values=".38;.38;.72;.38"
              dur="3.6s"
              repeatCount="indefinite"
          />
      </path>


      <!-- amber reference plane -->

      <path
          d="M127 10
             L102 4
             L102 32
             L127 26"
          stroke="#b77d0b"
          stroke-width="1"
          opacity=".52"
      >
          <animate
              attributeName="opacity"
              values=".32;.32;.32;.68;.32"
              dur="3.6s"
              repeatCount="indefinite"
          />
      </path>


      <!-- far plane -->

      <path
          d="M94 8
             L64 2
             L64 34
             L94 28"
          stroke="#0b7358"
          stroke-width=".9"
          opacity=".36"
      />

  </g>


  <!-- =========================================================
       DEPTH AXIS
       ========================================================= -->

  <path
      d="M184 18H48"
      stroke="#168a69"
      stroke-width=".7"
      stroke-dasharray="4 7"
      opacity=".22"
  />


  <!-- amber focal point -->

  <circle
      cx="103"
      cy="18"
      r="2"
      stroke="#f59e0b"
      stroke-width="1"
      opacity=".82"
  >
      <animate
          attributeName="r"
          values="1.25;2.35;1.25"
          dur="2.8s"
          repeatCount="indefinite"
      />
  </circle>


  <!-- moving depth sample -->

  <rect
      x="169"
      y="16.6"
      width="7"
      height="2.8"
      rx="1.4"
      fill="#8ecb7f"
      opacity="0"
  >
      <animate
          attributeName="x"
          values="169;145;117;82;53"
          dur="4s"
          repeatCount="indefinite"
      />

      <animate
          attributeName="opacity"
          values="0;.8;.62;.30;0"
          dur="4s"
          repeatCount="indefinite"
      />
  </rect>


  <!-- =========================================================
       SMALL REAR DEPTH TICKS
       ========================================================= -->

  <g
      stroke-linecap="round"
  >

      <path
          d="M34 12H51"
          stroke="#0f8767"
          stroke-width=".8"
          opacity=".31"
      />

      <path
          d="M24 18H52"
          stroke="#11795e"
          stroke-width=".9"
          opacity=".38"
      />

      <path
          d="M37 24H53"
          stroke="#a7740c"
          stroke-width=".8"
          opacity=".27"
      />

  </g>


  <circle
      cx="48"
      cy="18"
      r="1.15"
      fill="#12a77a"
  >
      <animate
          attributeName="opacity"
          values=".18;.72;.18"
          dur="2.7s"
          repeatCount="indefinite"
      />
  </circle>

</svg>
