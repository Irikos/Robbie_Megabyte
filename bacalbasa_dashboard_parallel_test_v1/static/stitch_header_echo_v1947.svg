<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 205 42"
    fill="none"
>

    <!-- ==========================================================
         V1.9.47 — SIGNAL ECHO

         Completely different motif:
           curved sonar/radar echoes
           floating signal nodes
           travelling amber pulse

         Navigation capsule is immediately to the RIGHT.
         ========================================================== -->


    <!-- ----------------------------------------------------------
         LARGE INNER ECHO
         ---------------------------------------------------------- -->

    <path
        d="
        M196 7
        C173 8 158 12 148 21
        C158 30 173 34 196 35
        "
        stroke="#159873"
        stroke-width="1.15"
        stroke-linecap="round"
        opacity=".70"
    >
        <animate
            attributeName="opacity"
            values=".40;.86;.40"
            dur="4.4s"
            repeatCount="indefinite"
        />
    </path>


    <!-- ----------------------------------------------------------
         SECOND ECHO
         ---------------------------------------------------------- -->

    <path
        d="
        M155 10
        C137 11 125 15 117 21
        C125 27 137 31 155 32
        "
        stroke="#128667"
        stroke-width="1"
        stroke-linecap="round"
        opacity=".57"
    >
        <animate
            attributeName="opacity"
            values=".30;.30;.70;.30"
            dur="4.4s"
            repeatCount="indefinite"
        />
    </path>


    <!-- ----------------------------------------------------------
         THIRD ECHO
         ---------------------------------------------------------- -->

    <path
        d="
        M119 13
        C105 14 96 17 90 21
        C96 25 105 28 119 29
        "
        stroke="#10775c"
        stroke-width=".9"
        stroke-linecap="round"
        opacity=".44"
    >
        <animate
            attributeName="opacity"
            values=".24;.24;.24;.57;.24"
            dur="4.4s"
            repeatCount="indefinite"
        />
    </path>


    <!-- ----------------------------------------------------------
         DISTANT ECHO
         ---------------------------------------------------------- -->

    <path
        d="
        M87 16
        C76 16.5 69 18.5 64 21
        C69 23.5 76 25.5 87 26
        "
        stroke="#0e6952"
        stroke-width=".8"
        stroke-linecap="round"
        opacity=".33"
    />


    <!-- ----------------------------------------------------------
         SMALL FAR ECHO
         ---------------------------------------------------------- -->

    <path
        d="
        M59 18
        C51 18.3 46 19.3 42 21
        C46 22.7 51 23.7 59 24
        "
        stroke="#0c5c49"
        stroke-width=".7"
        stroke-linecap="round"
        opacity=".24"
    />


    <!-- ----------------------------------------------------------
         INNER SIGNAL CORE
         ---------------------------------------------------------- -->

    <circle
        cx="181"
        cy="21"
        r="2"
        fill="#159873"
        opacity=".72"
    >
        <animate
            attributeName="r"
            values="1.3;2.3;1.3"
            dur="2.8s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values=".38;.88;.38"
            dur="2.8s"
            repeatCount="indefinite"
        />
    </circle>


    <circle
        cx="181"
        cy="21"
        r="5"
        stroke="#159873"
        stroke-width=".65"
        opacity=".28"
    >
        <animate
            attributeName="r"
            values="3.5;7;3.5"
            dur="3.2s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values=".32;.06;.32"
            dur="3.2s"
            repeatCount="indefinite"
        />
    </circle>


    <!-- ----------------------------------------------------------
         AMBER SCAN PULSE
         ---------------------------------------------------------- -->

    <circle
        cy="21"
        r="1.45"
        fill="#f59e0b"
    >

        <animate
            attributeName="cx"
            values="
            177;
            147;
            117;
            90;
            64;
            42
            "
            dur="4.6s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values="
            0;
            .90;
            .70;
            .48;
            .22;
            0
            "
            dur="4.6s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="r"
            values="
            1.8;
            1.5;
            1.25;
            1;
            .75;
            .5
            "
            dur="4.6s"
            repeatCount="indefinite"
        />

    </circle>


    <!-- ----------------------------------------------------------
         SMALL FLOATING GREEN NODES
         ---------------------------------------------------------- -->

    <circle
        cx="134"
        cy="14"
        r="1"
        fill="#8ecb7f"
        opacity=".48"
    >
        <animate
            attributeName="opacity"
            values=".20;.68;.20"
            dur="3.7s"
            repeatCount="indefinite"
        />
    </circle>


    <circle
        cx="101"
        cy="27"
        r=".8"
        fill="#159873"
        opacity=".38"
    >
        <animate
            attributeName="opacity"
            values=".18;.58;.18"
            dur="4.1s"
            begin=".8s"
            repeatCount="indefinite"
        />
    </circle>


    <!-- ----------------------------------------------------------
         VERY QUIET OUTER SIGNAL TICKS
         ---------------------------------------------------------- -->

    <path
        d="M31 17H23"
        stroke="#116c53"
        stroke-width=".75"
        stroke-linecap="round"
        opacity=".25"
    />

    <path
        d="M34 21H17"
        stroke="#11765a"
        stroke-width=".8"
        stroke-linecap="round"
        opacity=".30"
    />

    <path
        d="M31 25H25"
        stroke="#9d6d0c"
        stroke-width=".7"
        stroke-linecap="round"
        opacity=".20"
    />

</svg>
